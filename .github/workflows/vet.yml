# Gerado pelo Vet - não edite manualmente
name: vet
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1' # varredura semanal (novas CVEs em código parado)
permissions:
  contents: read
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andersonaderaldo/vet-runner:1
      options: --user root # o checkout grava em /__w (dono: usuário do runner); o container é descartado ao fim do job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 — bancos do Trivy/Grype/OSV (Grype: ~3 min -> segundos)
        with:
          path: /cache
          key: vet-cache-${{ github.run_id }}
          restore-keys: vet-cache-
      - name: Vet scan
        env:
          VET_API_URL: ${{ vars.VET_API_URL }}
          VET_INGEST_TOKEN: ${{ secrets.VET_INGEST_TOKEN }}
        run: vet-scan --tools gitleaks,trufflehog,semgrep,osv-scanner,trivy-fs,grype,checkov,hadolint,syft --fail-on info --sarif vet.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        continue-on-error: true # Code Scanning exige GitHub Advanced Security em repositório privado
        with: { sarif_file: vet.sarif }
